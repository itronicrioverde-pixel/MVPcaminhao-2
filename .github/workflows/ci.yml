name: CI

on:
  workflow_dispatch:
  push:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm run install:ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Test finance (Linux)
        run: node scripts/test-finance.mjs

      - name: Test API client
        run: node scripts/test-api-client.mjs

      - name: Test API error envelope
        run: node scripts/test-api-errors.mjs

      - name: Build
        run: npm run build