name: CI

on:
  workflow_dispatch:
  push:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm run install:ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Test finance (Linux)
        run: node scripts/test-finance.mjs

      - name: Test API client
        run: node scripts/test-api-client.mjs

      - name: Test API error envelope
        run: node scripts/test-api-errors.mjs

      - name: Test UI flows and form state
        run: node scripts/test-ui-flows.mjs

      - name: Test records payload and save/load flows
        run: node scripts/test-records-flow.mjs

      - name: Test E2E state dir and URL guards
        run: node scripts/test-e2e-guards.mjs

      - name: Build
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Test E2E flows (Playwright, desktop + mobile)
        run: npm run test:e2e

      - name: Upload Playwright artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore